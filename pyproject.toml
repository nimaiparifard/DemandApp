[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demandops"
version = "0.1.0"
description = "Retail demand forecasting platform (MLOps-first): M5 / Walmart"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.11",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "mlflow>=2.14",
  "pandera>=0.19",
  "sqlalchemy>=2.0",
  "typer>=0.12",
]

[project.optional-dependencies]
statsforecast = ["statsforecast>=1.7"]
serving = ["fastapi>=0.110", "uvicorn>=0.29", "prometheus-client>=0.20", "httpx>=0.27"]
app = ["streamlit>=1.33", "httpx>=0.27"]
feast = ["feast[redis]>=0.40"]
monitoring = ["evidently>=0.4", "prometheus-client>=0.20"]
postgres = ["psycopg2-binary>=2.9"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "pandas-stubs", "types-PyYAML"]

[project.scripts]
demandops = "demandops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/demandops"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "pipelines", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PD"]
ignore = ["PD011", "PD010", "E501"]  # pivot() is intentional: ids/days are unique

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/demandops"]
strict = false
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: needs real M5 data or external services"]
addopts = "-q"

[tool.coverage.run]
source = ["src/demandops"]
omit = ["src/demandops/feature_repo/*"]  # needs the optional feast dependency

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pipelines.gates.GateConfig"]

[tool.ruff.lint.isort]
known-first-party = ["demandops", "pipelines"]
