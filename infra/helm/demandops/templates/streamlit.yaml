{{- if .Values.streamlit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demandops-streamlit
  labels: {{- include "demandops.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.streamlit.replicas }}
  selector:
    matchLabels: { app: demandops-streamlit }
  template:
    metadata:
      labels: { app: demandops-streamlit }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: streamlit
          image: {{ include "demandops.image" (list . .Values.image.streamlit) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8501 }]
          env:
            - { name: API_URL, value: "http://demand-forecaster-stable:{{ .Values.serving.port }}" }
          readinessProbe:
            httpGet: { path: /_stcore/health, port: http }
          resources: {{- toYaml .Values.streamlit.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: demandops-streamlit
  labels: {{- include "demandops.labels" . | nindent 4 }}
spec:
  selector: { app: demandops-streamlit }
  ports: [{ name: http, port: 8501, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demandops-streamlit
  labels: {{- include "demandops.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.serving.ingress.className }}
  rules:
    - host: {{ .Values.streamlit.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: demandops-streamlit, port: { number: 8501 } }
{{- end }}
