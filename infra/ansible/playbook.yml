# ansible-playbook -i inventory.ini playbook.yml
# inventory.ini is generated by `tofu apply` in infra/tofu/envs/vps (or write it by hand for any Ubuntu VPS).
- name: Prepare, harden and install k3s on the DemandOps server
  hosts: k3s_server
  become: true
  roles:
    - hardening
    - k3s
    - backup

- name: Bootstrap GitOps (Argo CD app-of-apps)
  hosts: k3s_server
  become: true
  tasks:
    - name: Install Argo CD with Helm
      ansible.builtin.shell: |
        helm upgrade --install argocd argo-cd \
          --repo {{ argocd_chart_repo }} --version {{ argocd_chart_version }} \
          --namespace argocd --create-namespace --wait --timeout 10m
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: true

    - name: Copy the root application manifest
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../argocd/root-app.yaml"
        dest: /tmp/root-app.yaml
        mode: "0644"

    - name: Apply the root application (installs the whole platform from git)
      ansible.builtin.command: kubectl apply -f /tmp/root-app.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: true
