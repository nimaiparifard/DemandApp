- name: Copy k3s binary from the control machine (blocked-internet path)
  ansible.builtin.copy:
    src: "{{ k3s_binary_local }}"
    dest: /usr/local/bin/k3s
    mode: "0755"
  when: k3s_binary_local | length > 0

- name: Download k3s binary from a mirror
  ansible.builtin.get_url:
    url: "{{ k3s_binary_url }}"
    dest: /usr/local/bin/k3s
    mode: "0755"
    timeout: 120
  when: k3s_binary_local | length == 0

- name: Registry mirrors (all image pulls go through Harbor proxy-cache)
  ansible.builtin.copy:
    src: "{{ registries_template }}"
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0600"
  notify: Restart k3s

- name: Install the k3s systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    mode: "0644"
  notify: Restart k3s

- name: Start k3s
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for the node to be Ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false
  retries: 5
  delay: 10
  register: k3s_node_ready
  until: k3s_node_ready.rc == 0

- name: Link kubectl to the k3s binary
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link

- name: Install Helm (from a pinned release tarball URL you can mirror)
  ansible.builtin.unarchive:
    src: "{{ helm_url | default('https://get.helm.sh/helm-v3.16.4-linux-amd64.tar.gz') }}"
    dest: /tmp
    remote_src: true
    creates: /tmp/linux-amd64/helm

- name: Place helm binary
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: "0755"
    remote_src: true
