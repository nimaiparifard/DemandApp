# Only needed with `serving.mode: kserve`. Chart pair pinned to the same release.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve-crd
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-6" }
spec:
  project: default
  source: { repoURL: "ghcr.io/kserve/charts", chart: kserve-crd, targetRevision: v0.16.0 }
  destination: { server: https://kubernetes.default.svc, namespace: kserve }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-5" }
spec:
  project: default
  source:
    repoURL: ghcr.io/kserve/charts
    chart: kserve
    targetRevision: v0.16.0
    helm:
      values: |
        kserve:
          controller:
            deploymentMode: RawDeployment
  destination: { server: https://kubernetes.default.svc, namespace: kserve }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
