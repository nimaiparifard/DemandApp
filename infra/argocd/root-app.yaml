# App of apps: `kubectl apply -f infra/argocd/root-app.yaml` installs the entire platform.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/demandops.git
    targetRevision: main
    path: infra/argocd/apps
    directory: { recurse: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
