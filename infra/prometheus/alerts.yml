groups:
  - name: demandops
    rules:
      - alert: ServingHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(demand_request_seconds_bucket{route="/v2/models/demand-forecaster/infer"}[5m]))) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Inference p95 latency above 100 ms" }
      - alert: ServingErrorRate
        expr: sum(rate(demand_requests_total{status=~"5.."}[5m])) / sum(rate(demand_requests_total[5m])) > 0.02
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Inference 5xx rate above 2%" }
      - alert: DemandDataDrift
        expr: demandops_data_drift_score >= 0.3
        for: 0m
        labels: { severity: warning, action: retrain }
        annotations: { summary: "Share of drifted features >= 30% - trigger retrain DAG" }
      - alert: DemandForecastErrorDrift
        expr: demandops_error_drift_ratio >= 1.25
        for: 0m
        labels: { severity: warning, action: retrain }
        annotations: { summary: "Realised WAPE is 25% above its backtest baseline - trigger retrain DAG" }
      - alert: DemandForecastBias
        expr: max(abs(demandops_forecast_bias)) >= 0.25
        labels: { severity: warning, action: retrain }
        annotations: { summary: "Realised forecasts are off by >= 25 % in level (backtest bias is within 5 %): retrain" }
      - alert: DemandTargetDrift
        expr: max(demandops_feature_psi{feature="sales"}) >= 0.25
        labels: { severity: warning, action: retrain }
        annotations: { summary: "The sales distribution itself drifted (PSI >= 0.25): retrain" }
