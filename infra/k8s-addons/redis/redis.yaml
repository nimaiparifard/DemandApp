# Feast online store. One small StatefulSet is enough; the official redis image is proxy-cached by Harbor.
apiVersion: v1
kind: Service
metadata: { name: demandops-redis-master }
spec:
  selector: { app: demandops-redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: demandops-redis }
spec:
  serviceName: demandops-redis-master
  replicas: 1
  selector:
    matchLabels: { app: demandops-redis }
  template:
    metadata:
      labels: { app: demandops-redis }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999 }
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes", "--save", "60", "1000"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { exec: { command: [redis-cli, ping] }, periodSeconds: 5 }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
