# CloudNativePG replaces AWS RDS: HA-capable Postgres with WAL archiving + base backups to the S3 store.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: demandops-pg
spec:
  instances: 1                       # 3 on a multi-node cluster
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage: { size: 10Gi }
  resources:
    requests: { cpu: 100m, memory: 512Mi }
  bootstrap:
    initdb:
      database: demandops
      owner: demandops
      secret: { name: demandops-pg-credentials }   # basic-auth Secret: username=demandops, password=...
      postInitSQL:
        - CREATE DATABASE mlflow OWNER demandops
        - CREATE DATABASE airflow OWNER demandops
        - CREATE DATABASE feast OWNER demandops
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      destinationPath: s3://pg-backups/
      endpointURL: http://s3.storage.svc:8333
      s3Credentials:
        accessKeyId: { name: s3-credentials, key: AWS_ACCESS_KEY_ID }
        secretAccessKey: { name: s3-credentials, key: AWS_SECRET_ACCESS_KEY }
      wal: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: demandops-pg-nightly
spec:
  schedule: "0 0 2 * * *"            # 6-field cron (seconds first): 02:00 every night
  backupOwnerReference: self
  cluster: { name: demandops-pg }
