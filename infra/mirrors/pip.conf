# Linux/macOS: ~/.config/pip/pip.conf   Windows: %APPDATA%\pip\pip.ini
# Point at an Iranian PyPI mirror (or your own devpi/Nexus). Check which one is alive today.
[global]
index-url = https://mirror-pypi.runflare.com/simple
# fall back to the official index (through a proxy) for packages the mirror is missing
extra-index-url = https://pypi.org/simple
timeout = 60
