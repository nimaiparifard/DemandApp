name: build-images
# CD for the application: build -> push to the registry -> bump the image tag in git -> Argo CD syncs.
# Registry: GHCR by default. For Harbor set repo variables REGISTRY (e.g. harbor.example.ir/demandops)
# and secrets REGISTRY_USER / REGISTRY_PASSWORD. If GitHub-hosted runners cannot reach your server,
# run this workflow on a self-hosted runner inside the cluster (actions-runner-controller).
on:
  push:
    branches: [main]
    paths: ["src/**", "pipelines/**", "apps/**", "infra/docker/**", "pyproject.toml"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ${{ vars.REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  build-push:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY && vars.REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Build and push (tag = git sha)
        run: |
          SHA=${GITHUB_SHA::7}
          for spec in "serving:infra/docker/Dockerfile:serving" "jobs:infra/docker/Dockerfile:jobs" \
                      "streamlit:infra/docker/Dockerfile.streamlit:" "airflow:infra/docker/Dockerfile.airflow:"; do
            IFS=: read -r name file target <<< "$spec"
            docker buildx build -f "$file" ${target:+--target $target} \
              -t "$REGISTRY/demandops-$name:$SHA" -t "$REGISTRY/demandops-$name:latest" \
              --cache-from type=gha,scope=$name --cache-to type=gha,scope=$name,mode=max --push .
          done

  bump-tag:
    # GitOps: the new image tag is a commit; Argo CD notices it and rolls the change out.
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set image.tag in the Helm values
        run: |
          SHA=${GITHUB_SHA::7}
          sed -i -E "s/^(  tag: ).*/\1$SHA/" infra/helm/demandops/values.yaml
          sed -i -E "s/^(defaultAirflowTag: ).*/\1$SHA/" infra/k8s-addons/airflow/values.yaml
      - name: Commit
        run: |
          git config user.name  "demandops-bot"
          git config user.email "demandops-bot@users.noreply.github.com"
          git add infra
          git diff --cached --quiet || (git commit -m "chore(release): images ${GITHUB_SHA::7}" && git push)
